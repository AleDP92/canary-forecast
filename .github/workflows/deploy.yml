name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Vuelve a publicar la web para renovar los resúmenes con IA:
  # 06:30, 12:30 y 18:30 en Canarias en invierno (una hora más en verano)
  schedule:
    - cron: '30 6,12,18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secreto del repo (Settings → Secrets and variables → Actions)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Variable opcional del repo para cambiar de modelo
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Si falla (sin clave, cuota agotada…), la web se publica igual sin resúmenes
      - name: Generar resúmenes con IA
        if: env.GEMINI_API_KEY != ''
        continue-on-error: true
        run: node scripts/generate-summaries.mjs dist/data/resumenes.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
